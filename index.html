<!DOCTYPE html>
<html lang="bn">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1d2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>বাংলার সেবা</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    @font-face {
      font-family:'Noto Sans Bengali';
      src:url('fonts/NotoSansBengali-Regular.ttf') format('truetype');
      font-weight:normal;font-style:normal;
    }
    :root{
      --bg-dark:#0f1020;--bg-card:#161830;--text-light:#ffffff;
      --muted-light:rgba(255,255,255,.85);--glass:rgba(255,255,255,.05);
      --glass-border:rgba(255,255,255,.08);
      --tab-active-bg:rgba(255,255,255,.12);--tab-inactive-bg:rgba(255,255,255,.04);
      --tab-active-text:#ffffff;--tab-inactive-text:rgba(255,255,255,.5);
      --danger:#ef4444;--danger-bg:rgba(239,68,68,.12);
      --success:#22c55e;--success-bg:rgba(34,197,94,.12);
      --blue:#3b82f6;--blue-bg:rgba(59,130,246,.12);
      --overlay-bg:rgba(0,0,0,.7);--admin-bg:#0d0f1e;
      --input-bg:rgba(255,255,255,.06);--input-border:rgba(255,255,255,.1);
    }
    :root.light{
      --bg-dark:#f3f6ff;--bg-card:#ffffff;--text-light:#0b1220;
      --muted-light:rgba(11,18,32,.8);--glass:rgba(0,0,0,.04);
      --glass-border:rgba(0,0,0,.06);
      --tab-active-bg:rgba(59,130,246,.12);--tab-inactive-bg:rgba(0,0,0,.03);
      --tab-active-text:#2563eb;--tab-inactive-text:rgba(0,0,0,.4);
      --danger-bg:rgba(239,68,68,.08);--success-bg:rgba(34,197,94,.08);
      --blue-bg:rgba(59,130,246,.08);--overlay-bg:rgba(0,0,0,.4);
      --admin-bg:#f0f4ff;--input-bg:rgba(0,0,0,.04);--input-border:rgba(0,0,0,.1);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Noto Sans Bengali',sans-serif;background:var(--bg-dark);color:var(--text-light);transition:background .3s,color .3s;}
    .app{max-width:960px;margin:0 auto;padding:14px;}
    .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
    .title{display:flex;align-items:center;gap:10px;}
    .logo{width:44px;height:44px;border-radius:12px;background:var(--glass);display:flex;align-items:center;justify-content:center;}
    h1{margin:0;font-size:18px;}
    p.subtitle{margin:0;font-size:12px;opacity:.8;}
    .topbar-right{display:flex;align-items:center;gap:8px;}
    .theme-toggle,.admin-btn{background:var(--glass);border:none;padding:8px 10px;border-radius:8px;color:var(--text-light);cursor:pointer;display:flex;align-items:center;gap:5px;font-size:13px;font-family:inherit;transition:all .2s;}
    .admin-btn{background:var(--blue-bg);color:var(--blue);}
    .admin-btn.logged-in{background:var(--success-bg);color:var(--success);}
    .searchbar{margin:12px 0;}
    .searchbar input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass);color:var(--text-light);font-size:14px;outline:none;font-family:inherit;}
    .searchbar input::placeholder{opacity:.5;}
    .searchbar input:focus{border-color:rgba(59,130,246,.4);}

    .cat-tabs{display:flex;gap:8px;margin:14px 0 6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
    .cat-tabs::-webkit-scrollbar{display:none;}
    .cat-tab{flex-shrink:0;padding:8px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent;background:var(--tab-inactive-bg);color:var(--tab-inactive-text);transition:all .25s;display:flex;align-items:center;gap:6px;user-select:none;font-family:inherit;}
    .cat-tab:hover{background:var(--tab-active-bg);color:var(--tab-active-text);}
    .cat-tab.active{background:var(--tab-active-bg);color:var(--tab-active-text);border-color:var(--tab-active-text);}
    .cat-tab.active .cat-icon{transform:scale(1.15);}
    .cat-icon{font-size:14px;transition:transform .25s;}
    .cat-count{font-size:10px;background:var(--glass);padding:1px 6px;border-radius:99px;opacity:.7;}

    .recent h2{font-size:13px;margin:0 0 6px;opacity:.85;}
    .recent-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
    .recent-row::-webkit-scrollbar{display:none;}
    .chip{padding:6px 10px;background:var(--glass);border-radius:999px;font-size:12px;white-space:nowrap;text-decoration:none;color:var(--text-light);}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:10px;}
    .card{text-decoration:none;color:inherit;padding:16px;border-radius:16px;text-align:center;transition:transform .2s,box-shadow .2s;}
    .card:hover{transform:translateY(-4px);box-shadow:0 6px 20px rgba(0,0,0,.15);}
    .iconwrap{width:60px;height:60px;border-radius:12px;background:rgba(255,255,255,.15);margin:0 auto 10px;display:flex;justify-content:center;align-items:center;font-size:22px;}
    .card h3{font-size:14px;margin:0;}
    .card p{font-size:11px;opacity:.8;margin-top:6px;}
    .empty-state{grid-column:1/-1;text-align:center;padding:40px 20px;opacity:.5;font-size:14px;}

    /* ══════════ LOGIN MODAL ══════════ */
    .login-overlay{
      position:fixed;inset:0;background:var(--overlay-bg);z-index:2000;
      display:none;align-items:center;justify-content:center;
      animation:fadeIn .25s ease;
    }
    .login-overlay.open{display:flex;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes scaleIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

    .login-box{
      background:var(--admin-bg);border-radius:20px;padding:32px 28px;
      max-width:380px;width:90%;animation:scaleIn .3s cubic-bezier(.16,1,.3,1);
      border:1px solid var(--glass-border);
    }
    .login-header{text-align:center;margin-bottom:24px;}
    .login-icon{
      width:60px;height:60px;border-radius:50%;background:var(--blue-bg);
      display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
      font-size:24px;color:var(--blue);
    }
    .login-header h2{font-size:18px;margin-bottom:4px;}
    .login-header p{font-size:12px;opacity:.5;}
    .login-form .form-group{margin-bottom:14px;}
    .login-form .form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;opacity:.8;}
    .login-form .form-group input{
      width:100%;padding:11px 14px;border-radius:10px;
      border:1px solid var(--input-border);background:var(--input-bg);
      color:var(--text-light);font-size:14px;font-family:inherit;outline:none;
    }
    .login-form .form-group input:focus{border-color:var(--blue);}
    .login-error{
      font-size:12px;color:var(--danger);margin-bottom:10px;
      min-height:16px;transition:all .2s;
    }
    .login-actions{display:flex;gap:10px;}
    .login-actions .btn{flex:1;justify-content:center;}
    .login-close{
      position:absolute;top:16px;right:16px;background:var(--glass);
      border:none;width:32px;height:32px;border-radius:50%;color:var(--text-light);
      cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
    }

    /* ══════════ ADMIN PANEL ══════════ */
    .admin-overlay{
      position:fixed;inset:0;background:var(--overlay-bg);z-index:1500;
      display:none;align-items:flex-end;justify-content:center;
      animation:fadeIn .25s ease;
    }
    .admin-overlay.open{display:flex;}
    .admin-panel{
      width:100%;max-width:640px;max-height:92vh;
      background:var(--admin-bg);border-radius:20px 20px 0 0;
      display:flex;flex-direction:column;
      animation:slideUp .35s cubic-bezier(.16,1,.3,1);overflow:hidden;
    }
    .admin-header{
      display:flex;justify-content:space-between;align-items:center;
      padding:16px 20px 12px;border-bottom:1px solid var(--glass-border);flex-shrink:0;
      flex-wrap:wrap;gap:8px;
    }
    .admin-header-left{display:flex;align-items:center;gap:10px;}
    .admin-header-left h2{font-size:16px;display:flex;align-items:center;gap:8px;}
    .admin-email{font-size:11px;opacity:.5;display:flex;align-items:center;gap:4px;}
    .admin-header-right{display:flex;align-items:center;gap:6px;}
    .admin-close{background:var(--glass);border:none;width:34px;height:34px;border-radius:50%;color:var(--text-light);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
    .btn-logout{background:var(--danger-bg);border:none;padding:6px 12px;border-radius:8px;color:var(--danger);cursor:pointer;font-size:12px;font-family:inherit;font-weight:600;display:flex;align-items:center;gap:5px;}
    .btn-logout:hover{background:var(--danger);color:#fff;}
    .admin-body{overflow-y:auto;flex:1;padding:16px 20px 30px;}

    .admin-tabs{display:flex;gap:6px;margin-bottom:16px;}
    .admin-tab{flex:1;padding:10px;border-radius:10px;border:none;background:var(--tab-inactive-bg);color:var(--tab-inactive-text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
    .admin-tab.active{background:var(--blue-bg);color:var(--blue);}
    .admin-section{display:none;}
    .admin-section.active{display:block;}

    .form-group{margin-bottom:14px;}
    .form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;opacity:.8;}
    .form-group input,.form-group select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-light);font-size:14px;font-family:inherit;outline:none;}
    .form-group input:focus,.form-group select:focus{border-color:var(--blue);}
    .form-group select{cursor:pointer;}
    .form-group select option{background:var(--admin-bg);color:var(--text-light);}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .icon-preview{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:12px;opacity:.6;}
    .icon-preview i{font-size:20px;}

    .btn{padding:10px 20px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .2s;}
    .btn-blue{background:var(--blue);color:#fff;}.btn-blue:hover{opacity:.9;}
    .btn-danger{background:var(--danger-bg);color:var(--danger);}.btn-danger:hover{background:var(--danger);color:#fff;}
    .btn-success{background:var(--success-bg);color:var(--success);}.btn-success:hover{background:var(--success);color:#fff;}
    .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;}
    .btn-full{width:100%;justify-content:center;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}

    .manage-cat-title{font-size:13px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;}
    .manage-cat-title.seva{background:rgba(246,211,101,.12);color:#f6d365;}
    .manage-cat-title.utility{background:rgba(79,172,254,.12);color:#4facfe;}
    .manage-cat-title.update{background:rgba(67,233,123,.12);color:#43e97b;}
    .manage-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--glass);margin-bottom:8px;border:1px solid var(--glass-border);transition:all .2s;}
    .manage-item:hover{border-color:var(--blue);}
    .manage-item-icon{width:38px;height:38px;border-radius:10px;background:var(--glass);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .manage-item-info{flex:1;min-width:0;}
    .manage-item-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .manage-item-tags{font-size:11px;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .manage-item-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
    .move-dropdown{padding:5px 8px;border-radius:6px;font-size:11px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-light);cursor:pointer;font-family:inherit;}
    .move-dropdown option{background:var(--admin-bg);color:var(--text-light);}

    .sync-status{display:flex;align-items:center;gap:6px;font-size:12px;padding:8px 12px;border-radius:8px;background:var(--glass);margin-bottom:14px;}
    .sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .sync-dot.online{background:var(--success);}
    .sync-dot.offline{background:var(--danger);}

    /* Toast */
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:3000;opacity:0;transition:all .35s cubic-bezier(.16,1,.3,1);pointer-events:none;white-space:nowrap;font-family:inherit;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast.success{background:var(--success);color:#fff;}
    .toast.error{background:var(--danger);color:#fff;}
    .toast.info{background:var(--blue);color:#fff;}

    /* Confirm Dialog */
    .confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2500;display:none;align-items:center;justify-content:center;}
    .confirm-overlay.open{display:flex;}
    .confirm-box{background:var(--admin-bg);border-radius:16px;padding:24px;max-width:340px;width:90%;text-align:center;}
    .confirm-box p{font-size:14px;margin-bottom:18px;line-height:1.5;}
    .confirm-box .confirm-actions{display:flex;gap:10px;justify-content:center;}

    /* Loading spinner */
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<!-- ══════════ MAIN APP ══════════ -->
<div class="app">
  <div class="topbar">
    <div class="title">
      <div class="logo"><i class="fa-solid fa-globe"></i></div>
      <div>
        <h1>বাংলার সেবা</h1>
        <p class="subtitle">দ্রুত লিংক</p>
      </div>
    </div>
    <div class="topbar-right">
      <button class="admin-btn" id="adminOpenBtn"><i class="fa-solid fa-shield-halved"></i> <span id="adminBtnText">Admin</span></button>
      <button class="theme-toggle" id="themeBtn"><i class="fa-regular fa-sun" id="themeIcon"></i> <span id="themeText">থিম</span></button>
    </div>
  </div>

  <div class="searchbar">
    <input type="text" id="searchInput" placeholder="Search by English or Bengali name...">
  </div>

  <div class="cat-tabs" id="catTabs">
    <button class="cat-tab active" data-cat="seva">
      <i class="fa-solid fa-hand-holding-heart cat-icon"></i>
      <span>সেবা</span>
      <span class="cat-count" id="count-seva"></span>
    </button>
    <button class="cat-tab" data-cat="utility">
      <i class="fa-solid fa-wrench cat-icon"></i>
      <span>ইউটিলিটি</span>
      <span class="cat-count" id="count-utility"></span>
    </button>
    <button class="cat-tab" data-cat="update">
      <i class="fa-solid fa-rotate cat-icon"></i>
      <span>আপডেট</span>
      <span class="cat-count" id="count-update"></span>
    </button>
  </div>

  <div class="recent" id="recentWrap">
    <h2>সাম্প্রতিক</h2>
    <div class="recent-row" id="recentRow"><span style="font-size:12px;opacity:0.7;">সাম্প্রতিক সেবা এখানে প্রদর্শিত হবে</span></div>
  </div>

  <div class="grid" id="serviceGrid"></div>
</div>

<!-- ══════════ LOGIN MODAL ══════════ -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box" style="position:relative;">
    <div class="login-header">
      <div class="login-icon"><i class="fa-solid fa-lock"></i></div>
      <h2>Admin Login</h2>
      <p>অনুমোদিত প্রশাসক শুধুমাত্র</p>
    </div>
    <div class="login-form">
      <div class="form-group">
        <label><i class="fa-solid fa-envelope"></i> Email</label>
        <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-key"></i> Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="login-error" id="loginError"></div>
      <div class="login-actions">
        <button class="btn btn-full" style="background:var(--glass);color:var(--text-light);" id="loginCancelBtn">বাতিল</button>
        <button class="btn btn-blue btn-full" id="loginSubmitBtn"><i class="fa-solid fa-right-to-bracket"></i> লগইন</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════ ADMIN PANEL ══════════ -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-panel">
    <div class="admin-header">
      <div class="admin-header-left">
        <h2><i class="fa-solid fa-shield-halved"></i> Admin Panel</h2>
        <span class="admin-email" id="adminEmail"></span>
      </div>
      <div class="admin-header-right">
        <button class="btn-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        <button class="admin-close" id="adminCloseBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <div class="admin-body">

      <div class="sync-status" id="syncStatus">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">Checking...</span>
      </div>

      <div class="admin-tabs">
        <button class="admin-tab active" data-section="add"><i class="fa-solid fa-plus"></i> Add</button>
        <button class="admin-tab" data-section="manage"><i class="fa-solid fa-pen"></i> Manage</button>
        <button class="admin-tab" data-section="settings"><i class="fa-solid fa-gear"></i> Settings</button>
      </div>

      <!-- ADD SECTION -->
      <div class="admin-section active" id="section-add">
        <div class="form-group">
          <label>সেবার নাম (Service Name) *</label>
          <input type="text" id="addName" placeholder="e.g. কন্যাশ্রী">
        </div>
        <div class="form-group">
          <label>URL *</label>
          <input type="url" id="addUrl" placeholder="https://example.com">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Icon Class *</label>
            <input type="text" id="addIcon" placeholder="fa-heart" value="fa-circle">
            <div class="icon-preview"><i class="fa-solid fa-circle" id="iconPreview"></i> <span>FontAwesome 6</span></div>
          </div>
          <div class="form-group">
            <label>Tags (English)</label>
            <input type="text" id="addTags" placeholder="e.g. kanyashree scheme">
          </div>
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select id="addCat">
            <option value="seva">সেবা (Seva)</option>
            <option value="utility">ইউটিলিটি (Utility)</option>
            <option value="update">আপডেট (Update)</option>
          </select>
        </div>
        <button class="btn btn-blue btn-full" id="addSubmitBtn"><i class="fa-solid fa-plus"></i> সেবা যোগ করুন</button>
      </div>

      <!-- MANAGE SECTION -->
      <div class="admin-section" id="section-manage">
        <div id="manageList"></div>
      </div>

      <!-- SETTINGS SECTION -->
      <div class="admin-section" id="section-settings">
        <div style="margin-bottom:16px;">
          <button class="btn btn-success btn-full" id="pushDefaultsBtn"><i class="fa-solid fa-cloud-arrow-up"></i> Push Defaults to Cloud</button>
          <p style="font-size:11px;opacity:.5;margin-top:6px;text-align:center;">Upload default services to Firestore (first-time setup)</p>
        </div>
        <div style="margin-bottom:16px;">
          <button class="btn btn-danger btn-full" id="resetAllBtn"><i class="fa-solid fa-arrow-rotate-left"></i> Reset to Default Services</button>
          <p style="font-size:11px;opacity:.5;margin-top:6px;text-align:center;">Reset local data to built-in defaults</p>
        </div>
        <div style="margin-bottom:16px;">
          <button class="btn btn-full" style="background:var(--blue-bg);color:var(--blue);" id="exportBtn"><i class="fa-solid fa-download"></i> Export Services (JSON)</button>
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;opacity:.8;display:block;margin-bottom:6px;">Import Services (JSON)</label>
          <input type="file" id="importFile" accept=".json" style="font-size:13px;">
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMsg">Are you sure?</p>
    <div class="confirm-actions">

// ══════════════════════════════════════════
// SERVICES STATE
// ══════════════════════════════════════════
let services = [];
let firestoreReady = false;

function loadServicesLocal(){
  const saved = localStorage.getItem('wb_services');
  if(saved){
    try{ services = JSON.parse(saved); } catch(e){ services = JSON.parse(JSON.stringify(DEFAULT_SERVICES)); }
  } else {
    services = JSON.parse(JSON.stringify(DEFAULT_SERVICES));
  }
}

function saveServicesLocal(){
  localStorage.setItem('wb_services', JSON.stringify(services));
}

async function loadServicesFromFirestore(){
  try{
    const doc = await db.collection('app').doc('services').get();
    if(doc.exists && doc.data().items && doc.data().items.length > 0){
      services = doc.data().items;
      saveServicesLocal();
      return true;
    }
  } catch(e){
    console.warn('Firestore load failed:', e.message);
  }
  return false;
}

async function saveServicesToFirestore(){
  try{
    await db.collection('app').doc('services').set({
      items: services,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    saveServicesLocal();
    updateSyncStatus(true);
    return true;
  } catch(e){
    console.error('Firestore save error:', e);
    saveServicesLocal();
    updateSyncStatus(false);
    return false;
  }
}

// Real-time listener for service updates
let unsubscribeSnapshot = null;
function setupFirestoreListener(){
  if(unsubscribeSnapshot) unsubscribeSnapshot();
  unsubscribeSnapshot = db.collection('app').doc('services').onSnapshot(doc => {
    if(doc.exists && doc.data().items && doc.data().items.length > 0){
      const newItems = doc.data().items;
      // Only update if different (avoid unnecessary re-renders)
      if(JSON.stringify(newItems) !== JSON.stringify(services)){
        services = newItems;
        saveServicesLocal();
        updateCounts();
        renderServices(lastFilter);
      }
    }
    firestoreReady = true;
    updateSyncStatus(true);
  }, error => {
    console.warn('Snapshot listener error:', error.message);
    firestoreReady = false;
    updateSyncStatus(false);
  });
}

function updateSyncStatus(online){
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  if(online){
    dot.className = 'sync-dot online';
    text.textContent = 'ক্লাউড সিঙ্ক সক্রিয়';
  } else {
    dot.className = 'sync-dot offline';
    text.textContent = 'অফলাইন — লোকাল ডেটা ব্যবহৃত';
  }
}

let activeCat='seva';

let lastFilter="";

function normalize(s){return(s||"").toLowerCase().trim();}

function updateCounts(){
  const c={seva:0,utility:0,update:0};
  services.forEach(s=>c[s.cat]++);
  document.getElementById('count-seva').textContent=c.seva;
  document.getElementById('count-utility').textContent=c.utility;

catTabs.addEventListener('click',e=>{

  tab.classList.add('active');
  activeCat=tab.dataset.cat;

function renderRecent(order){
  recentRow.innerHTML="";
  const items=order.map(n=>services.find(s=>s.name===n)).filter(Boolean).slice(0,8);
  if(!items.length){
    recentRow.innerHTML='<span style="font-size:12px;opacity:0.7;">সাম্প্রতিক সেবা এখানে প্রদর্শিত হবে</span>';
    return;
  }
  items.forEach(s=>{
    const chip=document.createElement('a');chip.className='chip';
    chip.textContent=s.name;chip.href=s.url;chip.target='_blank';
    chip.addEventListener('click',()=>storeRecent(s.name));
    recentRow.appendChild(chip);
  });
}

function storeRecent(name){
  let order=JSON.parse(localStorage.getItem('serviceOrder'))||[];
  order=order.filter(x=>x!==name);order.unshift(name);
  localStorage.setItem('serviceOrder',JSON.stringify(order));
  renderServices(lastFilter);
}

function renderServices(filter=""){
  lastFilter=filter;grid.innerHTML="";
  const f=normalize(filter);
  let order=JSON.parse(localStorage.getItem('serviceOrder'))||[];
  let sorted=[...services].sort((a,b)=>{
    let ai=order.indexOf(a.name),bi=order.indexOf(b.name);
    if(ai===-1&&bi===-1)return 0;if(ai===-1)return 1;if(bi===-1)return -1;return ai-bi;
  });
  const filtered=sorted.filter(s=>s.cat===activeCat&&(normalize(s.name).includes(f)||normalize(s.tags).includes(f)));
  if(!filtered.length){
    grid.innerHTML='<div class="empty-state"><i class="fa-solid fa-folder-open" style="font-size:28px;margin-bottom:8px;display:block;"></i>এই বিভাগে কোনো সেবা পাওয়া যায়নি</div>';
    renderRecent(order);return;
  }
  filtered.forEach(s=>{
    const card=document.createElement('a');card.className='card';
    card.href=s.url;card.target='_blank';card.style.background=randomColor();
    card.innerHTML=`<div class="iconwrap"><i class="fa-solid ${s.icon}"></i></div><h3>${s.name}</h3><p>অবস্থা দেখুন</p>`;
    card.addEventListener('click',()=>storeRecent(s.name));
    grid.appendChild(card);
  });
  renderRecent(order);
}

// Login
const loginSubmitBtn = document.getElementById('loginSubmitBtn');
const loginError = document.getElementById('loginError');
const loginEmailInput = document.getElementById('loginEmail');
const loginPasswordInput = document.getElementById('loginPassword');

async function handleLogin(){
  const email = loginEmailInput.value.trim();
  const password = loginPasswordInput.value;

  if(!email || !password){
    loginError.textContent = 'ইমেইল ও পাসওয়ার্ড দিন';
    return;
  }

  loginError.textContent = '';
  loginSubmitBtn.disabled = true;
  loginSubmitBtn.innerHTML = '<span class="spinner"></span> লগইন হচ্ছে...';

  try {
    await auth.signInWithEmailAndPassword(email, password);
    // Success — close login, open admin
    loginOverlay.classList.remove('open');
    loginEmailInput.value = '';
    loginPasswordInput.value = '';
    loginError.textContent = '';
    showToast('✓ সফলভাবে লগইন হয়েছে', 'success');
    // Open admin panel
    setTimeout(() => {
      adminOverlay.classList.add('open');
      renderManageList();
      updateSyncStatus(firestoreReady);
    }, 300);
  } catch(e) {
    console.error('Login error:', e.code);
    const errorMessages = {
      'auth/user-not-found': 'এই ইমেইলে কোনো অ্যাকাউন্ট নেই',
      'auth/wrong-password': 'ভুল পাসওয়ার্ড',
      'auth/invalid-credential': 'ভুল ইমেইল বা পাসওয়ার্ড',
      'auth/invalid-email': 'অবৈধ ইমেইল ঠিকানা',
      'auth/too-many-requests': 'অনেকবার চেষ্টা করেছেন, কিছুক্ষণ পর আবার চেষ্টা করুন',
      'auth/user-disabled': 'এই অ্যাকাউন্ট নিষ্ক্রিয় করা হয়েছে',
      'auth/network-request-failed': 'নেটওয়ার্ক ত্রুটি, ইন্টারনেট সংযোগ পরীক্ষা করুন',
    };
    loginError.textContent = errorMessages[e.code] || 'লগইন ব্যর্থ হয়েছে: ' + e.message;
  } finally {
    loginSubmitBtn.disabled = false;
    loginSubmitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> লগইন';
  }
}

loginSubmitBtn.addEventListener('click', handleLogin);
loginPasswordInput.addEventListener('keydown', e => { if(e.key === 'Enter') handleLogin(); });
loginEmailInput.addEventListener('keydown', e => { if(e.key === 'Enter') loginPasswordInput.focus(); });

document.getElementById('addSubmitBtn').addEventListener('click', async () => {

  const name = document.getElementById('addName').value.trim();
  const url = document.getElementById('addUrl').value.trim();
  const icon = addIconInput.value.trim() || 'fa-circle';
  const tags = document.getElementById('addTags').value.trim();
  const cat = document.getElementById('addCat').value;

  if(!name){ showToast('সেবার নাম দিন', 'error'); return; }
  if(!url){ showToast('URL দিন', 'error'); return; }
  if(services.some(s => s.name === name)){ showToast('এই নাম আগেই আছে', 'error'); return; }

  services.push({name, url, icon, tags, cat});

  const btn = document.getElementById('addSubmitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> সেভ হচ্ছে...';

  const saved = await saveServicesToFirestore();

    showToast('✓ সেবা যোগ হয়েছে', 'success');

    showToast('ক্লাউডে সেভ ব্যর্থ, লোকালি সেভ হয়েছে', 'error');
  }

  btn.disabled = false;

  // Clear form
  document.getElementById('addName').value = '';
  document.getElementById('addUrl').value = '';

  document.getElementById('addTags').value = '';
  iconPreview.className = 'fa-solid fa-circle';

});

// ADMIN — MANAGE SERVICES
// ══════════════════════════════════════════
const catLabels = {seva:'সেবা', utility:'ইউটিলিটি', update:'আপডেট'};
const catIcons = {seva:'fa-hand-holding-heart', utility:'fa-wrench', update:'fa-rotate'};

function renderManageList(){
  const container = document.getElementById('manageList');
  container.innerHTML = '';

  ['seva','utility','update'].forEach(cat => {
    const items = services.filter(s => s.cat === cat);
    const title = document.createElement('div');
    title.className = 'manage-cat-title ' + cat;
    title.innerHTML = `<i class="fa-solid ${catIcons[cat]}"></i> ${catLabels[cat]} (${items.length})`;
    container.appendChild(title);

    if(!items.length){
      const empty = document.createElement('div');
      empty.style.cssText = 'font-size:12px;opacity:.5;padding:8px 12px;margin-bottom:12px;';
      empty.textContent = 'এই বিভাগে কোনো সেবা নেই';
      container.appendChild(empty);
      return;
    }

    items.forEach(s => {
      const globalIdx = services.indexOf(s);
      const otherCats = Object.keys(catLabels).filter(c => c !== cat);
      const item = document.createElement('div');
      item.className = 'manage-item';
      item.innerHTML = `
        <div class="manage-item-icon"><i class="fa-solid ${s.icon}"></i></div>
        <div class="manage-item-info">
          <div class="manage-item-name">${s.name}</div>
          <div class="manage-item-tags">${s.tags || '—'}</div>
        </div>
        <div class="manage-item-actions">
          <select class="move-dropdown" data-idx="${globalIdx}" title="Move to">
            <option value="" disabled selected>স্থানান্তর</option>
            ${otherCats.map(c => `<option value="${c}">→ ${catLabels[c]}</option>`).join('')}
          </select>
          <button class="btn btn-sm btn-danger" data-remove="${globalIdx}" title="Remove"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;
      container.appendChild(item);
    });
  });

  // Bind move events
  container.querySelectorAll('.move-dropdown').forEach(dd => {
    dd.addEventListener('change', async e => {
      if(!currentUser){ showToast('লগইন আবশ্যক', 'error'); return; }
      const idx = parseInt(e.target.dataset.idx);
      const newCat = e.target.value;
      if(newCat && services[idx]){
        const oldCat = catLabels[services[idx].cat];
        services[idx].cat = newCat;
        const saved = await saveServicesToFirestore();
        showToast(saved ? `✓ "${services[idx].name}" → ${catLabels[newCat]}` : 'ক্লাউড সেভ ব্যর্থ', saved ? 'success' : 'error');
        updateCounts();
        renderServices(lastFilter);
        renderManageList();
      }
    });
  });

  // Bind remove events
  container.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      if(!currentUser){ showToast('লগইন আবশ্যক', 'error'); return; }
      const idx = parseInt(btn.dataset.remove);
      const name = services[idx].name;
      showConfirm(`"${name}" মুছে ফেলতে চান?`, async () => {
        services.splice(idx, 1);
        const saved = await saveServicesToFirestore();
        showToast(saved ? `✗ "${name}" মুছে ফেলা হয়েছে` : 'ক্লাউড সেভ ব্যর্থ', saved ? 'info' : 'error');
        updateCounts();
        renderServices(lastFilter);
        renderManageList();
      });
    });
  });
}

// ══════════════════════════════════════════
// ADMIN — SETTINGS
// ══════════════════════════════════════════

// Push defaults to Firestore
document.getElementById('pushDefaultsBtn').addEventListener('click', () => {
  if(!currentUser){ showToast('লগইন আবশ্যক', 'error'); return; }
  showConfirm('ডিফল্ট সেবাগুলি ক্লাউডে আপলোড করবেন? বর্তমান ক্লাউড ডেটা প্রতিস্থাপিত হবে।', async () => {
    services = JSON.parse(JSON.stringify(DEFAULT_SERVICES));
    const saved = await saveServicesToFirestore();
    showToast(saved ? '✓ ডিফল্ট ক্লাউডে আপলোড হয়েছে' : 'আপলোড ব্যর্থ', saved ? 'success' : 'error');
    updateCounts();
    renderServices(lastFilter);
    renderManageList();
  });
});

// Reset to defaults (local)
document.getElementById('resetAllBtn').addEventListener('click', () => {
  if(!currentUser){ showToast('লগইন আবশ্যক', 'error'); return; }
  showConfirm('সব পরিবর্তন মুছে ডিফল্টে ফিরে যাবে?', async () => {
    services = JSON.parse(JSON.stringify(DEFAULT_SERVICES));
    const saved = await saveServicesToFirestore();
    showToast(saved ? '✓ ডিফল্টে রিসেট হয়েছে' : 'রিসেট ব্যর্থ', saved ? 'success' : 'error');
    updateCounts();
    renderServices(lastFilter);
    renderManageList();
  });
});

// Export
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(services, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'banglar_seva_services.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('✓ JSON এক্সপোর্ট হয়েছে', 'success');
});

// Import
document.getElementById('importFile').addEventListener('change', e => {
  if(!currentUser){ showToast('লগইন আবশ্যক', 'error'); e.target.value=''; return; }
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw new Error('Not an array');
      data.forEach((s, i) => {
        if(!s.name || !s.url || !s.cat) throw new Error(`Item ${i} missing required fields`);
        if(!['seva','utility','update'].includes(s.cat)) throw new Error(`Item ${i} has invalid category`);
        if(!s.icon) s.icon = 'fa-circle';
        if(!s.tags) s.tags = '';
      });
      showConfirm(`${data.length}টি সেবা ইম্পোর্ট করবেন? বর্তমান ডেটা প্রতিস্থাপিত হবে।`, async () => {
        services = data;
        const saved = await saveServicesToFirestore();
        showToast(saved ? `✓ ${data.length}টি সেবা ইম্পোর্ট হয়েছে` : 'ইম্পোর্ট ব্যর্থ', saved ? 'success' : 'error');
        updateCounts();
        renderServices(lastFilter);
        renderManageList();
      });
    } catch(err) {
      showToast('JSON বৈধ নয়: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ══════════════════════════════════════════
// INITIALIZATION
// ══════════════════════════════════════════
async function initApp(){
  // 1. Load from local cache first for instant display
  loadServicesLocal();
  updateCounts();
  renderServices();

  // 2. Try Firestore
  try {
    const loaded = await loadServicesFromFirestore();
    if(loaded){
      updateCounts();
      renderServices();
    }
    // 3. Set up real-time listener
    setupFirestoreListener();
  } catch(e) {
    console.warn('Firebase init error, using local data:', e.message);
    updateSyncStatus(false);
  }
}

initApp();
</script>

  });
}
</script>
