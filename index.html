<!DOCTYPE html>
<html lang="bn">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1d2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>বাংলার সেবা</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    @font-face{font-family:'Noto Sans Bengali';src:url('fonts/NotoSansBengali-Regular.ttf') format('truetype');font-weight:normal;font-style:normal;}
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg-dark:#0f1020;--bg-card:#161830;--text-light:#ffffff;
      --muted-light:rgba(255,255,255,.85);--glass:rgba(255,255,255,.05);
      --glass-border:rgba(255,255,255,.08);
      --tab-inactive-bg:rgba(255,255,255,.04);--tab-inactive-text:rgba(255,255,255,.5);
      --danger:#ef4444;--danger-bg:rgba(239,68,68,.12);
      --success:#22c55e;--success-bg:rgba(34,197,94,.12);
      --overlay-bg:rgba(0,0,0,.7);--admin-bg:#0d0f1e;
      --input-bg:rgba(255,255,255,.06);--input-border:rgba(255,255,255,.1);
      --accent:#3b82f6;--accent-light:#60a5fa;--accent-dark:#1d4ed8;
      --accent-bg:rgba(59,130,246,.12);--accent-bg-strong:rgba(59,130,246,.25);
    }
    :root.light{
      --bg-dark:#f3f6ff;--bg-card:#ffffff;--text-light:#0b1220;
      --muted-light:rgba(11,18,32,.8);--glass:rgba(0,0,0,.04);
      --glass-border:rgba(0,0,0,.06);
      --tab-inactive-bg:rgba(0,0,0,.03);--tab-inactive-text:rgba(0,0,0,.4);
      --danger-bg:rgba(239,68,68,.08);--success-bg:rgba(34,197,94,.08);
      --overlay-bg:rgba(0,0,0,.4);--admin-bg:#f0f4ff;
      --input-bg:rgba(0,0,0,.04);--input-border:rgba(0,0,0,.1);
    }
    body{font-family:'Noto Sans Bengali',sans-serif;background:var(--bg-dark);color:var(--text-light);transition:background .4s,color .4s;}
    .app{max-width:960px;margin:0 auto;padding:14px;}
    .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
    .title{display:flex;align-items:center;gap:10px;}
    .logo{width:44px;height:44px;border-radius:12px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;color:var(--accent);transition:all .3s;}
    h1{margin:0;font-size:18px;}
    p.subtitle{margin:0;font-size:12px;opacity:.8;}
    .topbar-right{display:flex;align-items:center;gap:6px;}
    .icon-btn{background:var(--glass);border:none;padding:8px 10px;border-radius:8px;color:var(--text-light);cursor:pointer;display:flex;align-items:center;gap:5px;font-size:13px;font-family:inherit;transition:all .2s;}
    .icon-btn:hover{background:var(--accent-bg);color:var(--accent);}
    .admin-btn{background:var(--accent-bg);color:var(--accent);transition:all .3s;}
    .admin-btn.logged-in{background:var(--success-bg);color:var(--success);}

    .color-btn-wrap{position:relative;}
    .color-popover{position:absolute;top:calc(100% + 8px);right:0;z-index:900;background:var(--admin-bg);border:1px solid var(--glass-border);border-radius:14px;padding:14px;min-width:240px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:none;animation:popIn .2s ease;}
    .color-popover.open{display:block;}
    @keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    .color-popover-title{font-size:12px;font-weight:700;opacity:.6;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
    .color-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
    .color-swatch{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:all .2s;background:var(--glass);}
    .color-swatch:hover{border-color:var(--accent-bg-strong);transform:scale(1.05);}
    .color-swatch.active{border-color:var(--accent);background:var(--accent-bg);}
    .color-dot{width:28px;height:28px;border-radius:50%;transition:transform .2s;}
    .color-swatch:hover .color-dot{transform:scale(1.15);}
    .color-swatch.active .color-dot{box-shadow:0 0 0 3px var(--accent-bg-strong);}
    .color-swatch-name{font-size:9px;opacity:.6;text-align:center;white-space:nowrap;}
    .color-swatch.active .color-swatch-name{opacity:1;font-weight:600;}

    .searchbar{margin:12px 0;}
    .searchbar input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass);color:var(--text-light);font-size:14px;outline:none;font-family:inherit;transition:border-color .2s;}
    .searchbar input::placeholder{opacity:.5;}
    .searchbar input:focus{border-color:var(--accent);}

    .cat-tabs{display:flex;gap:8px;margin:14px 0 6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
    .cat-tabs::-webkit-scrollbar{display:none;}
    .cat-tab{flex-shrink:0;padding:8px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent;background:var(--tab-inactive-bg);color:var(--tab-inactive-text);transition:all .25s;display:flex;align-items:center;gap:6px;user-select:none;font-family:inherit;}
    .cat-tab:hover{background:var(--accent-bg);color:var(--accent);}
    .cat-tab.active{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);}
    .cat-tab.active .cat-icon{transform:scale(1.15);}
    .cat-icon{font-size:14px;transition:transform .25s;}
    .cat-count{font-size:10px;background:var(--glass);padding:1px 6px;border-radius:99px;opacity:.7;}

    .recent h2{font-size:13px;margin:0 0 6px;opacity:.85;}
    .recent-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
    .recent-row::-webkit-scrollbar{display:none;}
    .chip{padding:6px 10px;background:var(--glass);border-radius:999px;font-size:12px;white-space:nowrap;text-decoration:none;color:var(--text-light);transition:background .2s;}
    .chip:hover{background:var(--accent-bg);}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:10px;}
    .card{text-decoration:none;color:inherit;padding:16px;border-radius:16px;text-align:center;transition:transform .2s,box-shadow .2s;}
    .card:hover{transform:translateY(-4px);box-shadow:0 6px 20px rgba(0,0,0,.15);}
    .iconwrap{width:60px;height:60px;border-radius:12px;background:rgba(255,255,255,.15);margin:0 auto 10px;display:flex;justify-content:center;align-items:center;font-size:22px;}
    .card h3{font-size:14px;margin:0;}
    .card p{font-size:11px;opacity:.8;margin-top:6px;}
    .empty-state{grid-column:1/-1;text-align:center;padding:40px 20px;opacity:.5;font-size:14px;}

    /* ══════════ NEWS IN SHORTS ══════════ */
    .news-section{margin-bottom:16px;}
    .news-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
    .news-header h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
    .news-header h2 i{color:var(--accent);}
    .news-badge{font-size:10px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:99px;font-weight:600;}
    .news-list{display:flex;flex-direction:column;gap:10px;}
    .news-card{
      display:flex;gap:12px;padding:14px;border-radius:14px;
      background:var(--glass);border:1px solid var(--glass-border);
      border-left:3px solid var(--accent);transition:all .2s;
      position:relative;overflow:hidden;
    }
    .news-card:hover{border-left-color:var(--accent-light);background:var(--accent-bg);}
    .news-card-icon{
      width:40px;height:40px;border-radius:10px;flex-shrink:0;
      background:var(--accent-bg);display:flex;align-items:center;justify-content:center;
      color:var(--accent);font-size:16px;
    }
    .news-card-body{flex:1;min-width:0;}
    .news-card-title{font-size:14px;font-weight:700;margin-bottom:4px;line-height:1.3;}
    .news-card-text{font-size:13px;line-height:1.5;opacity:.75;}
    .news-card-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;opacity:.5;}
    .news-new-tag{font-size:9px;background:var(--danger);color:#fff;padding:1px 6px;border-radius:99px;font-weight:700;animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .news-empty{text-align:center;padding:20px;opacity:.4;font-size:13px;}

    /* ══════════ LOGIN MODAL ══════════ */
    .login-overlay{position:fixed;inset:0;background:var(--overlay-bg);z-index:2000;display:none;align-items:center;justify-content:center;animation:fadeIn .25s ease;}
    .login-overlay.open{display:flex;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes scaleIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
    .login-box{background:var(--admin-bg);border-radius:20px;padding:32px 28px;max-width:380px;width:90%;animation:scaleIn .3s cubic-bezier(.16,1,.3,1);border:1px solid var(--glass-border);}
    .login-header{text-align:center;margin-bottom:24px;}
    .login-icon{width:60px;height:60px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px;color:var(--accent);transition:all .3s;}
    .login-header h2{font-size:18px;margin-bottom:4px;}
    .login-header p{font-size:12px;opacity:.5;}
    .login-form .form-group{margin-bottom:14px;}
    .login-form .form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;opacity:.8;}
    .login-form .form-group input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-light);font-size:14px;font-family:inherit;outline:none;}
    .login-form .form-group input:focus{border-color:var(--accent);}
    .login-error{font-size:12px;color:var(--danger);margin-bottom:10px;min-height:16px;}
    .login-actions{display:flex;gap:10px;}
    .login-actions .btn{flex:1;justify-content:center;}

    /* ══════════ ADMIN PANEL ══════════ */
    .admin-overlay{position:fixed;inset:0;background:var(--overlay-bg);z-index:1500;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease;}
    .admin-overlay.open{display:flex;}
    .admin-panel{width:100%;max-width:640px;max-height:92vh;background:var(--admin-bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slideUp .35s cubic-bezier(.16,1,.3,1);overflow:hidden;}
    .admin-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 12px;border-bottom:1px solid var(--glass-border);flex-shrink:0;flex-wrap:wrap;gap:8px;}
    .admin-header-left{display:flex;align-items:center;gap:10px;}
    .admin-header-left h2{font-size:16px;display:flex;align-items:center;gap:8px;color:var(--accent);}
    .admin-email{font-size:11px;opacity:.5;display:flex;align-items:center;gap:4px;}
    .admin-header-right{display:flex;align-items:center;gap:6px;}
    .admin-close{background:var(--glass);border:none;width:34px;height:34px;border-radius:50%;color:var(--text-light);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
    .btn-logout{background:var(--danger-bg);border:none;padding:6px 12px;border-radius:8px;color:var(--danger);cursor:pointer;font-size:12px;font-family:inherit;font-weight:600;display:flex;align-items:center;gap:5px;transition:all .2s;}
    .btn-logout:hover{background:var(--danger);color:#fff;}
    .admin-body{overflow-y:auto;flex:1;padding:16px 20px 30px;}
    .admin-tabs{display:flex;gap:5px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;}
    .admin-tabs::-webkit-scrollbar{display:none;}
    .admin-tab{flex-shrink:0;padding:9px 14px;border-radius:10px;border:none;background:var(--tab-inactive-bg);color:var(--tab-inactive-text);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;}
    .admin-tab.active{background:var(--accent-bg);color:var(--accent);}
    .admin-section{display:none;}
    .admin-section.active{display:block;}

    .form-group{margin-bottom:14px;}
    .form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;opacity:.8;}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-light);font-size:14px;font-family:inherit;outline:none;}
    .form-group textarea{resize:vertical;min-height:70px;line-height:1.5;}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);}
    .form-group select{cursor:pointer;}
    .form-group select option{background:var(--admin-bg);color:var(--text-light);}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .icon-preview{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:12px;opacity:.6;}
    .icon-preview i{font-size:20px;}

    .btn{padding:10px 20px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .2s;}
    .btn-accent{background:var(--accent);color:#fff;}.btn-accent:hover{opacity:.9;}
    .btn-danger{background:var(--danger-bg);color:var(--danger);}.btn-danger:hover{background:var(--danger);color:#fff;}
    .btn-success{background:var(--success-bg);color:var(--success);}.btn-success:hover{background:var(--success);color:#fff;}
    .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;}
    .btn-full{width:100%;justify-content:center;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}

    .manage-cat-title{font-size:13px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;}
    .manage-cat-title.seva{background:rgba(246,211,101,.12);color:#f6d365;}
    .manage-cat-title.utility{background:rgba(79,172,254,.12);color:#4facfe;}
    .manage-cat-title.update{background:rgba(67,233,123,.12);color:#43e97b;}
    .manage-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--glass);margin-bottom:8px;border:1px solid var(--glass-border);transition:all .2s;}
    .manage-item:hover{border-color:var(--accent);}
    .manage-item-icon{width:38px;height:38px;border-radius:10px;background:var(--glass);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .manage-item-info{flex:1;min-width:0;}
    .manage-item-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .manage-item-tags{font-size:11px;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .manage-item-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
    .move-dropdown{padding:5px 8px;border-radius:6px;font-size:11px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-light);cursor:pointer;font-family:inherit;}
    .move-dropdown option{background:var(--admin-bg);color:var(--text-light);}

    .sync-status{display:flex;align-items:center;gap:6px;font-size:12px;padding:8px 12px;border-radius:8px;background:var(--glass);margin-bottom:14px;}
    .sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .sync-dot.online{background:var(--success);}
    .sync-dot.offline{background:var(--danger);}

    /* Admin Theme */
    .admin-theme-section{margin-bottom:20px;}
    .admin-theme-section h3{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
    .admin-theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
    .admin-theme-swatch{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:all .2s;background:var(--glass);}
    .admin-theme-swatch:hover{border-color:var(--accent-bg-strong);}
    .admin-theme-swatch.active{border-color:var(--accent);background:var(--accent-bg);}
    .admin-theme-swatch .color-dot{width:24px;height:24px;border-radius:50%;}
    .admin-theme-swatch-name{font-size:9px;opacity:.6;}
    .admin-theme-swatch.active .admin-theme-swatch-name{opacity:1;font-weight:600;}
    .admin-theme-note{font-size:11px;opacity:.5;margin-top:8px;text-align:center;}

    /* Admin News */
    .news-manage-item{
      padding:12px;border-radius:12px;background:var(--glass);margin-bottom:10px;
      border:1px solid var(--glass-border);border-left:3px solid var(--accent);
    }
    .news-manage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
    .news-manage-title{font-size:13px;font-weight:700;}
    .news-manage-text{font-size:12px;opacity:.6;margin-top:4px;line-height:1.4;}
    .news-manage-date{font-size:11px;opacity:.4;margin-top:6px;}
    .news-manage-actions{display:flex;gap:6px;flex-shrink:0;}
    .news-edit-hint{font-size:11px;opacity:.4;margin-top:8px;font-style:italic;}

    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:3000;opacity:0;transition:all .35s cubic-bezier(.16,1,.3,1);pointer-events:none;white-space:nowrap;font-family:inherit;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast.success{background:var(--success);color:#fff;}
    .toast.error{background:var(--danger);color:#fff;}
    .toast.info{background:var(--accent);color:#fff;}

    .confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2500;display:none;align-items:center;justify-content:center;}
    .confirm-overlay.open{display:flex;}
    .confirm-box{background:var(--admin-bg);border-radius:16px;padding:24px;max-width:340px;width:90%;text-align:center;}
    .confirm-box p{font-size:14px;margin-bottom:18px;line-height:1.5;}
    .confirm-box .confirm-actions{display:flex;gap:10px;justify-content:center;}

    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="title">
      <div class="logo"><i class="fa-solid fa-globe"></i></div>
      <div><h1>বাংলার সেবা</h1><p class="subtitle">দ্রুত লিংক</p></div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn admin-btn" id="adminOpenBtn"><i class="fa-solid fa-shield-halved"></i> <span id="adminBtnText">Admin</span></button>
      <div class="color-btn-wrap">
        <button class="icon-btn" id="colorBtn"><i class="fa-solid fa-palette"></i></button>
        <div class="color-popover" id="colorPopover">
          <div class="color-popover-title"><i class="fa-solid fa-swatchbook"></i> Theme Color</div>
          <div class="color-grid" id="colorGrid"></div>
        </div>
      </div>
      <button class="icon-btn" id="themeBtn"><i class="fa-regular fa-sun" id="themeIcon"></i> <span id="themeText">থিম</span></button>
    </div>
  </div>

  <div class="searchbar"><input type="text" id="searchInput" placeholder="Search by English or Bengali name..."></div>

  <div class="cat-tabs" id="catTabs">
    <button class="cat-tab active" data-cat="seva"><i class="fa-solid fa-hand-holding-heart cat-icon"></i><span>সেবা</span><span class="cat-count" id="count-seva"></span></button>
    <button class="cat-tab" data-cat="utility"><i class="fa-solid fa-wrench cat-icon"></i><span>ইউটিলিটি</span><span class="cat-count" id="count-utility"></span></button>
    <button class="cat-tab" data-cat="update"><i class="fa-solid fa-rotate cat-icon"></i><span>আপডেট</span><span class="cat-count" id="count-update"></span></button>
  </div>

  <div class="recent" id="recentWrap">
    <h2>সাম্প্রতিক</h2>
    <div class="recent-row" id="recentRow"><span style="font-size:12px;opacity:.7">সাম্প্রতিক সেবা এখানে প্রদর্শিত হবে</span></div>
  </div>

  <!-- News Section (only visible in Update tab) -->
  <div class="news-section" id="newsSection" style="display:none">
    <div class="news-header">
      <h2><i class="fa-solid fa-bolt"></i> সংবাদ সংক্ষেপ</h2>
      <span class="news-badge" id="newsBadge">0</span>
    </div>
    <div class="news-list" id="newsList"></div>
  </div>

  <div class="grid" id="serviceGrid"></div>
</div>

let services=[],firestoreReady=false;
function loadServicesLocal(){const s=localStorage.getItem('wb_services');if(s){try{services=JSON.parse(s)}catch(e){services=JSON.parse(JSON.stringify(DEFAULT_SERVICES))}}else services=JSON.parse(JSON.stringify(DEFAULT_SERVICES))}
function saveServicesLocal(){localStorage.setItem('wb_services',JSON.stringify(services))}
async function loadServicesFromFirestore(){try{const d=await db.collection('app').doc('services').get();if(d.exists&&d.data().items&&d.data().items.length>0){services=d.data().items;saveServicesLocal();return true}}catch(e){console.warn(e.message)}return false}
async function saveServicesToFirestore(){try{await db.collection('app').doc('services').set({items:services,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});saveServicesLocal();updateSyncStatus(true);return true}catch(e){console.error(e);saveServicesLocal();updateSyncStatus(false);return false}}
let unsubSnap=null;
function setupFirestoreListener(){if(unsubSnap)unsubSnap();unsubSnap=db.collection('app').doc('services').onSnapshot(d=>{if(d.exists&&d.data().items&&d.data().items.length>0){if(JSON.stringify(d.data().items)!==JSON.stringify(services)){services=d.data().items;saveServicesLocal();updateCounts();renderServices(lastFilter)}}firestoreReady=true;updateSyncStatus(true)},e=>{firestoreReady=false;updateSyncStatus(false)})}

async function loadNewsFromFirestore(){try{const d=await db.collection('app').doc('news').get();if(d.exists&&d.data().items&&d.data().items.length>=0){newsItems=d.data().items;saveNewsLocal();return true}}catch(e){console.warn(e.message)}return false}

let activeCat='seva',lastFilter="";
function normalize(s){return(s||"").toLowerCase().trim()}
function updateCounts(){const c={seva:0,utility:0,update:0};services.forEach(s=>c[s.cat]++);document.getElementById('count-seva').textContent=c.seva;document.getElementById('count-utility').textContent=c.utility;document.getElementById('count-update').textContent=c.update}

function renderRecent(order){
  const rr=document.getElementById('recentRow');rr.innerHTML="";
  const items=order.map(n=>services.find(s=>s.name===n)).filter(Boolean).slice(0,8);
  if(!items.length){rr.innerHTML='<span style="font-size:12px;opacity:.7">সাম্প্রতিক সেবা এখানে প্রদর্শিত হবে</span>';return}
  items.forEach(s=>{const c=document.createElement('a');c.className='chip';c.textContent=s.name;c.href=s.url;c.target='_blank';c.addEventListener('click',()=>storeRecent(s.name));rr.appendChild(c)});
}
function storeRecent(name){let o=JSON.parse(localStorage.getItem('serviceOrder'))||[];o=o.filter(x=>x!==name);o.unshift(name);localStorage.setItem('serviceOrder',JSON.stringify(o));renderServices(lastFilter)}

function renderServices(filter=""){
  lastFilter=filter;const grid=document.getElementById('serviceGrid');grid.innerHTML="";const f=normalize(filter);
  let order=JSON.parse(localStorage.getItem('serviceOrder'))||[];
  let sorted=[...services].sort((a,b)=>{let ai=order.indexOf(a.name),bi=order.indexOf(b.name);if(ai===-1&&bi===-1)return 0;if(ai===-1)return 1;if(bi===-1)return -1;return ai-bi});
  const filtered=sorted.filter(s=>s.cat===activeCat&&(normalize(s.name).includes(f)||normalize(s.tags).includes(f)));
  // Show/hide news section
  document.getElementById('newsSection').style.display=activeCat==='update'?'block':'none';
  if(activeCat==='update')renderNews();
  if(!filtered.length){grid.innerHTML='<div class="empty-state"><i class="fa-solid fa-folder-open" style="font-size:28px;margin-bottom:8px;display:block"></i>এই বিভাগে কোনো সেবা পাওয়া যায়নি</div>';renderRecent(order);return}
  filtered.forEach(s=>{const c=document.createElement('a');c.className='card';c.href=s.url;c.target='_blank';c.style.background=randomColor();c.innerHTML=`<div class="iconwrap"><i class="fa-solid ${s.icon}"></i></div><h3>${s.name}</h3><p>অবস্থা দেখুন</p>`;c.addEventListener('click',()=>storeRecent(s.name));grid.appendChild(c)});
  renderRecent(order);
}
document.getElementById('searchInput').addEventListener('input',e=>renderServices(e.target.value));

function renderNews(){
  const list=document.getElementById('newsList'),badge=document.getElementById('newsBadge');
  badge.textContent=newsItems.length;
  if(!newsItems.length){list.innerHTML='<div class="news-empty"><i class="fa-solid fa-newspaper" style="font-size:20px;margin-bottom:6px;display:block"></i>এখনো কোনো সংবাদ নেই</div>';return}
  list.innerHTML="";
  const now=new Date();
  newsItems.forEach(n=>{
    const card=document.createElement('div');card.className='news-card';
    const isNew=n.date&&((now-new Date(n.date))/(1000*60*60*24))<7;
    const dateStr=n.date?new Date(n.date).toLocaleDateString('bn-IN',{year:'numeric',month:'short',day:'numeric'}):'';
    card.innerHTML=`
      <div class="news-card-icon"><i class="fa-solid ${n.icon||'fa-bullhorn'}"></i></div>
      <div class="news-card-body">
        <div class="news-card-title">${n.title}</div>
        <div class="news-card-text">${n.body}</div>
        <div class="news-card-meta">
          ${dateStr?`<span><i class="fa-regular fa-calendar"></i> ${dateStr}</span>`:''}
          ${isNew?'<span class="news-new-tag">নতুন</span>':''}
        </div>
      </div>`;
    list.appendChild(card);
  });
}

const toastEl=document.getElementById('toast');let toastTimer;
function showToast(msg,type='success'){clearTimeout(toastTimer);toastEl.textContent=msg;toastEl.className='toast '+type;requestAnimationFrame(()=>toastEl.classList.add('show'));toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2500)}
let confirmCallback=null;
function showConfirm(msg,cb){document.getElementById('confirmMsg').textContent=msg;confirmCallback=cb;document.getElementById('confirmOverlay').classList.add('open')}
document.getElementById('confirmYes').addEventListener('click',()=>{document.getElementById('confirmOverlay').classList.remove('open');if(confirmCallback)confirmCallback();confirmCallback=null});
document.getElementById('confirmNo').addEventListener('click',()=>{document.getElementById('confirmOverlay').classList.remove('open');confirmCallback=null});

// COLOR PICKER
// ═══════════════════════════════════════
buildColorGrid('colorGrid','color-swatch',id=>{applyThemeColor(id);localStorage.setItem('wb_themeColor',id);showToast('🎨 '+THEME_PRESETS.find(p=>p.id===id).name+' থিম','info')});
document.getElementById('colorBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('colorPopover').classList.toggle('open')});
document.addEventListener('click',e=>{if(!document.getElementById('colorBtn').contains(e.target)&&!document.getElementById('colorPopover').contains(e.target))document.getElementById('colorPopover').classList.remove('open')});

// ═══════════════════════════════════════
// AUTH
// ═══════════════════════════════════════
let currentUser=null;
const adminBtn=document.getElementById('adminOpenBtn'),loginOverlay=document.getElementById('loginOverlay'),adminOverlay=document.getElementById('adminOverlay');
auth.onAuthStateChanged(user=>{currentUser=user;if(user){adminBtn.classList.add('logged-in');document.getElementById('adminBtnText').textContent='Admin ✓';document.getElementById('adminEmail').textContent=user.email}else{adminBtn.classList.remove('logged-in');document.getElementById('adminBtnText').textContent='Admin';document.getElementById('adminEmail').textContent='';adminOverlay.classList.remove('open')}});
adminBtn.addEventListener('click',()=>{if(currentUser){adminOverlay.classList.add('open');renderManageList();updateSyncStatus(firestoreReady)}else{loginOverlay.classList.add('open');document.getElementById('loginEmail').focus()}});

const loginSubmitBtn=document.getElementById('loginSubmitBtn'),loginError=document.getElementById('loginError'),loginEmailInput=document.getElementById('loginEmail'),loginPasswordInput=document.getElementById('loginPassword');
async function handleLogin(){
  const email=loginEmailInput.value.trim(),password=loginPasswordInput.value;
  if(!email||!password){loginError.textContent='ইমেইল ও পাসওয়ার্ড দিন';return}
  loginError.textContent='';loginSubmitBtn.disabled=true;loginSubmitBtn.innerHTML='<span class="spinner"></span> লগইন...';
  try{await auth.signInWithEmailAndPassword(email,password);loginOverlay.classList.remove('open');loginEmailInput.value='';loginPasswordInput.value='';showToast('✓ লগইন সফল','success');setTimeout(()=>{adminOverlay.classList.add('open');renderManageList();updateSyncStatus(firestoreReady)},300)}
  catch(e){const m={'auth/user-not-found':'এই ইমেইলে অ্যাকাউন্ট নেই','auth/wrong-password':'ভুল পাসওয়ার্ড','auth/invalid-credential':'ভুল ইমেইল বা পাসওয়ার্ড','auth/invalid-email':'অবৈধ ইমেইল','auth/too-many-requests':'অনেকবার চেষ্টা, পরে আবার করুন','auth/user-disabled':'অ্যাকাউন্ট নিষ্ক্রিয়','auth/network-request-failed':'নেটওয়ার্ক ত্রুটি'};loginError.textContent=m[e.code]||'লগইন ব্যর্থ'}
  finally{loginSubmitBtn.disabled=false;loginSubmitBtn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> লগইন'}
}
loginSubmitBtn.addEventListener('click',handleLogin);
loginPasswordInput.addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin()});
loginEmailInput.addEventListener('keydown',e=>{if(e.key==='Enter')loginPasswordInput.focus()});
document.getElementById('loginCancelBtn').addEventListener('click',()=>{loginOverlay.classList.remove('open');loginEmailInput.value='';loginPasswordInput.value='';loginError.textContent=''});
loginOverlay.addEventListener('click',e=>{if(e.target===loginOverlay){loginOverlay.classList.remove('open');loginError.textContent=''}});
document.getElementById('logoutBtn').addEventListener('click',()=>showConfirm('লগআউট করতে চান?',async()=>{try{await auth.signOut();adminOverlay.classList.remove('open');showToast('লগআউট','info')}catch(e){showToast('লগআউট ব্যর্থ','error')}}));
document.getElementById('adminCloseBtn').addEventListener('click',()=>adminOverlay.classList.remove('open'));
adminOverlay.addEventListener('click',e=>{if(e.target===adminOverlay)adminOverlay.classList.remove('open')});

// Admin tabs
document.querySelectorAll('.admin-tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.admin-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.admin-section').forEach(s=>s.classList.remove('active'));tab.classList.add('active');document.getElementById('section-'+tab.dataset.section).classList.add('active');if(tab.dataset.section==='manage')renderManageList();if(tab.dataset.section==='news')renderNewsManage();if(tab.dataset.section==='theme')renderAdminTheme()})});

// ═══════════════════════════════════════
// ADMIN — ADD SERVICE
// ═══════════════════════════════════════
const addIconInput=document.getElementById('addIcon'),iconPreview=document.getElementById('iconPreview');
addIconInput.addEventListener('input',()=>{iconPreview.className='fa-solid '+(addIconInput.value.trim()||'fa-circle')});
document.getElementById('addSubmitBtn').addEventListener('click',async()=>{
  if(!currentUser){showToast('লগইন করুন','error');return}
  const name=document.getElementById('addName').value.trim(),url=document.getElementById('addUrl').value.trim(),icon=addIconInput.value.trim()||'fa-circle',tags=document.getElementById('addTags').value.trim(),cat=document.getElementById('addCat').value;
  if(!name){showToast('নাম দিন','error');return}if(!url){showToast('URL দিন','error');return}if(services.some(s=>s.name===name)){showToast('নাম আগেই আছে','error');return}
  services.push({name,url,icon,tags,cat});const btn=document.getElementById('addSubmitBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> সেভ...';
  const saved=await saveServicesToFirestore();showToast(saved?'✓ সেবা যোগ হয়েছে':'সেভ ব্যর্থ',saved?'success':'error');
  btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-plus"></i> সেবা যোগ করুন';
  document.getElementById('addName').value='';document.getElementById('addUrl').value='';addIconInput.value='fa-circle';document.getElementById('addTags').value='';iconPreview.className='fa-solid fa-circle';
  updateCounts();renderServices(lastFilter);
});

// ═══════════════════════════════════════
// ADMIN — MANAGE SERVICES
// ═══════════════════════════════════════
const catLabels={seva:'সেবা',utility:'ইউটিলিটি',update:'আপডেট'},catIcons={seva:'fa-hand-holding-heart',utility:'fa-wrench',update:'fa-rotate'};
function renderManageList(){
  const c=document.getElementById('manageList');c.innerHTML='';
  ['seva','utility','update'].forEach(cat=>{
    const items=services.filter(s=>s.cat===cat);const t=document.createElement('div');t.className='manage-cat-title '+cat;t.innerHTML=`<i class="fa-solid ${catIcons[cat]}"></i> ${catLabels[cat]} (${items.length})`;c.appendChild(t);
    if(!items.length){const e=document.createElement('div');e.style.cssText='font-size:12px;opacity:.5;padding:8px 12px;margin-bottom:12px';e.textContent='কোনো সেবা নেই';c.appendChild(e);return}
    items.forEach(s=>{const gi=services.indexOf(s),oc=Object.keys(catLabels).filter(x=>x!==cat);const item=document.createElement('div');item.className='manage-item';item.innerHTML=`<div class="manage-item-icon"><i class="fa-solid ${s.icon}"></i></div><div class="manage-item-info"><div class="manage-item-name">${s.name}</div><div class="manage-item-tags">${s.tags||'—'}</div></div><div class="manage-item-actions"><select class="move-dropdown" data-idx="${gi}"><option value="" disabled selected>স্থানান্তর</option>${oc.map(x=>`<option value="${x}">→ ${catLabels[x]}</option>`).join('')}</select><button class="btn btn-sm btn-danger" data-remove="${gi}"><i class="fa-solid fa-trash"></i></button></div>`;c.appendChild(item)});
  });
  c.querySelectorAll('.move-dropdown').forEach(dd=>{dd.addEventListener('change',async e=>{if(!currentUser)return;const i=parseInt(e.target.dataset.idx),nc=e.target.value;if(nc&&services[i]){services[i].cat=nc;const s=await saveServicesToFirestore();showToast(s?`✓ → ${catLabels[nc]}`:'সেভ ব্যর্থ',s?'success':'error');updateCounts();renderServices(lastFilter);renderManageList()}})});
  c.querySelectorAll('[data-remove]').forEach(btn=>{btn.addEventListener('click',()=>{if(!currentUser)return;const i=parseInt(btn.dataset.remove),n=services[i].name;showConfirm(`"${n}" মুছে ফেলতে চান?`,async()=>{services.splice(i,1);const s=await saveServicesToFirestore();showToast(s?`✗ "${n}" মুছে ফেলা হয়েছে`:'সেভ ব্যর্থ',s?'info':'error');updateCounts();renderServices(lastFilter);renderManageList()})})});
}

// ═══════════════════════════════════════
// ADMIN — NEWS MANAGEMENT
// ═══════════════════════════════════════
const newsIconInput=document.getElementById('newsIcon'),newsIconPreview=document.getElementById('newsIconPreview');
newsIconInput.addEventListener('input',()=>{newsIconPreview.className='fa-solid '+(newsIconInput.value.trim()||'fa-bullhorn')});

function generateId(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}

// Submit (Add or Update)
document.getElementById('newsSubmitBtn').addEventListener('click',async()=>{
  if(!currentUser){showToast('লগইন করুন','error');return}
  const title=document.getElementById('newsTitle').value.trim();
  const body=document.getElementById('newsBody').value.trim();
  const date=document.getElementById('newsDate').value;
  const icon=newsIconInput.value.trim()||'fa-bullhorn';
  const editId=document.getElementById('newsEditId').value;

  if(!title){showToast('শিরোনাম দিন','error');return}
  if(!body){showToast('বিবরণ দিন','error');return}

  const btn=document.getElementById('newsSubmitBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> সেভ...';

  if(editId){
    // Update existing
    const idx=newsItems.findIndex(n=>n.id===editId);
    if(idx!==-1){newsItems[idx]={...newsItems[idx],title,body,date,icon}}
  }else{
    // Add new
    newsItems.unshift({id:generateId(),title,body,date:date||new Date().toISOString().split('T')[0],icon});
  }

  const saved=await saveNewsToFirestore();
  showToast(saved?(editId?'✓ সংবাদ আপডেট হয়েছে':'✓ সংবাদ যোগ হয়েছে'):'সেভ ব্যর্থ',saved?'success':'error');
  btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-plus"></i> সংবাদ যোগ করুন';

  // Clear form
  document.getElementById('newsTitle').value='';
  document.getElementById('newsBody').value='';
  document.getElementById('newsDate').value='';
  newsIconInput.value='fa-bullhorn';newsIconPreview.className='fa-solid fa-bullhorn';
  document.getElementById('newsEditId').value='';
  document.getElementById('newsCancelEditBtn').style.display='none';

  renderNews();renderNewsManage();
});

// Cancel edit
document.getElementById('newsCancelEditBtn').addEventListener('click',()=>{
  document.getElementById('newsTitle').value='';
  document.getElementById('newsBody').value='';
  document.getElementById('newsDate').value='';
  newsIconInput.value='fa-bullhorn';newsIconPreview.className='fa-solid fa-bullhorn';
  document.getElementById('newsEditId').value='';
  document.getElementById('newsCancelEditBtn').style.display='none';
  document.getElementById('newsSubmitBtn').innerHTML='<i class="fa-solid fa-plus"></i> সংবাদ যোগ করুন';
});

function renderNewsManage(){
  const list=document.getElementById('newsManageList');
  document.getElementById('newsCountLabel').textContent=newsItems.length+'টি সংবাদ';
  if(!newsItems.length){list.innerHTML='<div style="text-align:center;padding:20px;opacity:.4;font-size:13px">কোনো সংবাদ নেই। উপরের ফর্ম থেকে যোগ করুন।</div>';return}
  list.innerHTML="";
  newsItems.forEach((n,idx)=>{
    const item=document.createElement('div');item.className='news-manage-item';
    const dateStr=n.date?new Date(n.date).toLocaleDateString('bn-IN',{year:'numeric',month:'short',day:'numeric'}):'';
    item.innerHTML=`
      <div class="news-manage-head">
        <div style="flex:1;min-width:0">
          <div class="news-manage-title"><i class="fa-solid ${n.icon||'fa-bullhorn'}" style="color:var(--accent);margin-right:4px"></i>${n.title}</div>
          <div class="news-manage-text">${n.body}</div>
          <div class="news-manage-date">${dateStr||'তারিখ নেই'}</div>
        </div>
        <div class="news-manage-actions">
          <button class="btn btn-sm btn-accent" data-edit="${idx}" title="Edit"><i class="fa-solid fa-pen"></i></button>
          <button class="btn btn-sm btn-danger" data-del="${idx}" title="Delete"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>`;
    list.appendChild(item);
  });

  // Edit buttons
  list.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=parseInt(btn.dataset.edit);const n=newsItems[idx];
      document.getElementById('newsTitle').value=n.title;
      document.getElementById('newsBody').value=n.body;
      document.getElementById('newsDate').value=n.date||'';
      newsIconInput.value=n.icon||'fa-bullhorn';newsIconPreview.className='fa-solid '+(n.icon||'fa-bullhorn');
      document.getElementById('newsEditId').value=n.id;
      document.getElementById('newsCancelEditBtn').style.display='flex';
      document.getElementById('newsSubmitBtn').innerHTML='<i class="fa-solid fa-check"></i> সংবাদ আপডেট করুন';
      // Scroll to form
      document.getElementById('newsTitle').scrollIntoView({behavior:'smooth',block:'center'});
      document.getElementById('newsTitle').focus();
    });
  });

  // Delete buttons
  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=parseInt(btn.dataset.del);const n=newsItems[idx];
      showConfirm(`"${n.title}" মুছে ফেলতে চান?`,async()=>{
        newsItems.splice(idx,1);
        const saved=await saveNewsToFirestore();
        showToast(saved?`✗ "${n.title}" মুছে ফেলা হয়েছে`:'সেভ ব্যর্থ',saved?'info':'error');
        renderNews();renderNewsManage();
      });
    });
  });
}

// ═══════════════════════════════════════
// ADMIN — THEME
// ═══════════════════════════════════════
function renderAdminTheme(){
  buildColorGrid('adminThemeGrid','admin-theme-swatch',async id=>{
    if(!currentUser)return;const s=await saveGlobalTheme(id);applyThemeColor(id);
    showToast(s?`✓ গ্লোবাল: ${THEME_PRESETS.find(p=>p.id===id).name}`:'সেভ ব্যর্থ',s?'success':'error');
    document.querySelectorAll('.admin-theme-swatch').forEach(x=>x.classList.toggle('active',x.dataset.id===id));
  });
  document.querySelectorAll('.admin-theme-swatch').forEach(s=>s.classList.toggle('active',s.dataset.id===globalThemeColor));
}
document.getElementById('resetUserThemeBtn').addEventListener('click',()=>{localStorage.removeItem('wb_themeColor');applyThemeColor(globalThemeColor);showToast('🎨 গ্লোবাল থিমে রিসেট','info')});

// ═══════════════════════════════════════
// ADMIN — MORE
// ═══════════════════════════════════════
document.getElementById('pushDefaultsBtn').addEventListener('click',()=>{if(!currentUser)return;showConfirm('ডিফল্ট ক্লাউডে আপলোড?',async()=>{services=JSON.parse(JSON.stringify(DEFAULT_SERVICES));const s=await saveServicesToFirestore();showToast(s?'✓ আপলোড হয়েছে':'আপলোড ব্যর্থ',s?'success':'error');updateCounts();renderServices(lastFilter);renderManageList()})});
document.getElementById('resetAllBtn').addEventListener('click',()=>{if(!currentUser)return;showConfirm('ডিফল্টে রিসেট?',async()=>{services=JSON.parse(JSON.stringify(DEFAULT_SERVICES));const s=await saveServicesToFirestore();showToast(s?'✓ রিসেট হয়েছে':'রিসেট ব্যর্থ',s?'success':'error');updateCounts();renderServices(lastFilter);renderManageList()})});
document.getElementById('exportBtn').addEventListener('click',()=>{const b=new Blob([JSON.stringify(services,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='banglar_seva_services.json';a.click();URL.revokeObjectURL(u);showToast('✓ এক্সপোর্ট','success')});
document.getElementById('importFile').addEventListener('change',e=>{if(!currentUser){e.target.value='';return}const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{try{const d=JSON.parse(ev.target.result);if(!Array.isArray(d))throw new Error('Not array');d.forEach((s,i)=>{if(!s.name||!s.url||!s.cat)throw new Error(`Item ${i} invalid`);if(!['seva','utility','update'].includes(s.cat))throw new Error(`Item ${i} bad cat`);if(!s.icon)s.icon='fa-circle';if(!s.tags)s.tags=''});showConfirm(`${d.length}টি ইম্পোর্ট?`,async()=>{services=d;const s=await saveServicesToFirestore();showToast(s?`✓ ${d.length}টি ইম্পোর্ট`:'ইম্পোর্ট ব্যর্থ',s?'success':'error');updateCounts();renderServices(lastFilter);renderManageList()})}catch(err){showToast('JSON বৈধ নয়: '+err.message,'error')}};r.readAsText(f);e.target.value=''});

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
async function initApp(){
  loadServicesLocal();loadNewsLocal();updateCounts();renderServices();
  try{await loadServicesFromFirestore();updateCounts();renderServices();setupFirestoreListener()}catch(e){updateSyncStatus(false)}
  try{await loadNewsFromFirestore();renderNews();setupNewsListener()}catch(e){}
  try{await loadGlobalTheme();setupThemeListener()}catch(e){}
}
initApp();
</script>
