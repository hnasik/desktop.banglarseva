<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern CV Builder - 10 Templates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-light: #eff6ff;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #e2e8f0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -10%; left: -10%;
            width: 50%; height: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0; pointer-events: none; filter: blur(60px);
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -10%; right: -10%;
            width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0; pointer-events: none; filter: blur(80px);
        }
        .cv-paper {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -6px rgba(0, 0, 0, 0.5);
        }
        .cv-name { font-family: 'Playfair Display', serif; }
        .font-serif-merri { font-family: 'Merriweather', serif; }
        .font-sans-lato { font-family: 'Lato', sans-serif; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        @media print {
            body { background: white; }
            body * { visibility: hidden; }
            #cv-preview, #cv-preview * { visibility: visible; }
            #cv-preview {
                position: absolute; left: 0; top: 0; width: 100%;
                box-shadow: none; border: none !important; border-radius: 0 !important;
            }
            .no-print { display: none !important; }
            @page { margin: 0; size: A4; }
        }

        .form-input {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155; color: #f1f5f9;
            border-radius: 0.375rem; transition: all 0.2s;
        }
        .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
            outline: none;
        }
        .form-input::placeholder { color: #64748b; }

        .dynamic-section {
            border: 1px solid #334155; border-radius: 0.5rem; padding: 1rem;
            margin-bottom: 1rem; background-color: rgba(15, 23, 42, 0.4);
            position: relative;
        }

        .text-primary { color: var(--primary-color); }
        .bg-primary-light { background-color: var(--primary-light); }
        .bg-primary { background-color: var(--primary-color); }
        .border-primary { border-color: var(--primary-color); }

        .page-break-line {
            position: absolute; top: 297mm; left: 0; right: 0;
            border-top: 2px dashed rgba(239, 68, 68, 0.5);
            pointer-events: none; z-index: 10;
        }
        .page-break-line span {
            position: absolute; right: 0; top: -12px;
            background-color: rgba(239, 68, 68, 0.9); color: white;
            font-size: 10px; padding: 2px 8px; border-radius: 4px;
        }
        
        .tmpl-btn {
            transition: all 0.2s;
        }
        .tmpl-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="no-print bg-slate-900/80 border-b border-slate-800 py-4 px-6 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-gradient-to-tr from-blue-600 to-sky-400 rounded-lg flex items-center justify-center text-white font-bold shadow-[0_0_15px_rgba(59,130,246,0.5)]">C</div>
                <h1 class="text-xl font-bold text-white">CV<span class="text-blue-500">Craft</span> <span class="text-xs text-slate-500 font-normal">10 Models</span></h1>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="clearData()" class="flex items-center space-x-1 text-slate-400 hover:text-red-400 px-4 py-2.5 rounded-lg font-medium transition-all border border-slate-700 hover:border-red-500/50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                    <span class="hidden sm:inline">Reset</span>
                </button>
                <button onclick="window.print()" class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg font-medium transition-all shadow-[0_0_20px_rgba(59,130,246,0.4)] hover:shadow-[0_0_25px_rgba(59,130,246,0.6)]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v3a2 2 0 002 2h1v2a2 2 0 002 2h6a2 2 0 002-2v-2h1a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clip-rule="evenodd" />
                    </svg>
                    <span>Download PDF</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-8 px-4 grid grid-cols-1 lg:grid-cols-2 gap-8 relative z-10">
        
        <!-- Left Side: Form -->
        <div class="no-print bg-slate-900/60 backdrop-blur-xl rounded-xl border border-slate-800 p-6 space-y-8 h-fit lg:sticky lg:top-24 max-h-[calc(100vh-7rem)] overflow-y-auto shadow-xl">
            
            <!-- Template Selector -->
            <section>
                <h2 class="text-lg font-semibold text-white border-b border-slate-700 pb-2 mb-4">1. Choose CV Model</h2>
                <div class="grid grid-cols-5 gap-2">
                    <button onclick="setTemplate(1)" class="tmpl-btn active text-xs py-2 rounded border border-slate-600 text-slate-300">Modern R</button>
                    <button onclick="setTemplate(2)" class="tmpl-btn text-xs py-2 rounded border border-slate-600 text-slate-300">Modern L</button>
                    <button onclick="setTemplate(3)" class="tmpl-btn text-xs py-2 rounded border border-slate-600 text-slate-300">Classic</button>
                    <button onclick="setTemplate(4)" class="tmpl-btn text-xs py-2 rounded border border-slate-600 text-slate-300">Top 2-Col</button>
                    <button onclick="setTemplate(5)" class="tmpl-btn text-xs py-2 rounded border border-slate-600 text-slate-300">Minimal</button>
                    <button onclick="setTemplate(6)" class="tmpl-btn text-xs py-2 rounded border border-slate-600 text-slate-300">Dark Exec</button>
                    <button onclick="setTemplate(7)" class="tmpl-btn text-xs py-2 rounded border border-slate-600 text-slate-300">Tinted L</button>
                    <button onclick="setTemplate(8)" class="tmpl-btn text-xs py-2 rounded border border-slate-600 text-slate-300">Creative</button>
                    <button onclick="setTemplate(9)" class="tmpl-btn text-xs py-2 rounded border border-slate-600 text-slate-300">Compact</button>
                    <button onclick="setTemplate(10)" class="tmpl-btn text-xs py-2 rounded border border-slate-600 text-slate-300">Boxed</button>
                </div>
            </section>

            <!-- Theme Color Picker -->
            <section>
                <h2 class="text-lg font-semibold text-white border-b border-slate-700 pb-2 mb-4">2. Theme Color</h2>
                <div class="flex items-center space-x-3">
                    <span class="text-sm text-slate-400">Accent:</span>
                    <button onclick="changeTheme('#3b82f6', '#eff6ff')" class="w-8 h-8 rounded-full bg-blue-600 border-2 border-slate-600 shadow-[0_0_10px_rgba(59,130,246,0.5)] hover:scale-110 transition"></button>
                    <button onclick="changeTheme('#059669', '#ecfdf5')" class="w-8 h-8 rounded-full bg-emerald-600 border-2 border-slate-600 hover:scale-110 transition"></button>
                    <button onclick="changeTheme('#e11d48', '#fff1f2')" class="w-8 h-8 rounded-full bg-rose-600 border-2 border-slate-600 hover:scale-110 transition"></button>
                    <button onclick="changeTheme('#d97706', '#fffbeb')" class="w-8 h-8 rounded-full bg-amber-600 border-2 border-slate-600 hover:scale-110 transition"></button>
                    <button onclick="changeTheme('#0284c7', '#f0f9ff')" class="w-8 h-8 rounded-full bg-sky-600 border-2 border-slate-600 hover:scale-110 transition"></button>
                </div>
            </section>

            <!-- Profile Picture -->
            <section>
                <h2 class="text-lg font-semibold text-white border-b border-slate-700 pb-2 mb-4">3. Profile Picture</h2>
                <div class="flex items-center space-x-4">
                    <img id="img-preview" src="https://ui-avatars.com/api/?name=Guest&background=334155&color=ffffff&bold=true" class="w-20 h-20 rounded-full object-cover border-2 border-slate-600">
                    <div>
                        <input type="file" id="img-upload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                        <button onclick="document.getElementById('img-upload').click()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition border border-slate-600">Upload Photo</button>
                        <p class="text-xs text-slate-500 mt-1">JPG or PNG. Max 5MB.</p>
                    </div>
                </div>
            </section>

            <!-- Personal Info -->
            <section>
                <h2 class="text-lg font-semibold text-white border-b border-slate-700 pb-2 mb-4">4. Personal Details</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium text-slate-400 mb-1">Full Name</label><input type="text" id="name" class="form-input w-full px-3 py-2" placeholder="John Doe" oninput="updateCV()"></div>
                    <div><label class="block text-sm font-medium text-slate-400 mb-1">Job Title</label><input type="text" id="title" class="form-input w-full px-3 py-2" placeholder="Senior Software Engineer" oninput="updateCV()"></div>
                    <div><label class="block text-sm font-medium text-slate-400 mb-1">Email</label><input type="email" id="email" class="form-input w-full px-3 py-2" placeholder="john@example.com" oninput="updateCV()"></div>
                    <div><label class="block text-sm font-medium text-slate-400 mb-1">Phone</label><input type="text" id="phone" class="form-input w-full px-3 py-2" placeholder="+1 234 567 890" oninput="updateCV()"></div>
                    <div><label class="block text-sm font-medium text-slate-400 mb-1">LinkedIn</label><input type="text" id="linkedin" class="form-input w-full px-3 py-2" placeholder="linkedin.com/in/johndoe" oninput="updateCV()"></div>
                    <div><label class="block text-sm font-medium text-slate-400 mb-1">Website</label><input type="text" id="website" class="form-input w-full px-3 py-2" placeholder="johndoe.com" oninput="updateCV()"></div>
                    <div class="md:col-span-2"><label class="block text-sm font-medium text-slate-400 mb-1">Location</label><input type="text" id="location" class="form-input w-full px-3 py-2" placeholder="New York, USA" oninput="updateCV()"></div>
                </div>
            </section>

            <!-- Summaries -->
            <section class="space-y-6">
                <div>
                    <h2 class="text-lg font-semibold text-white border-b border-slate-700 pb-2 mb-4">5. Professional Summary</h2>
                    <textarea id="summary" rows="3" class="form-input w-full px-3 py-2" placeholder="A brief 2-3 sentence overview..." oninput="updateCV()"></textarea>
                </div>
                <div>
                    <h2 class="text-lg font-semibold text-white border-b border-slate-700 pb-2 mb-4">6. Self Description</h2>
                    <textarea id="self-desc" rows="5" class="form-input w-full px-3 py-2" oninput="updateCV()">I am a highly motivated and hardworking professional dedicated to delivering exceptional results. I thrive in dynamic environments and readily accept new challenges to expand my skill set. My adaptability allows me to quickly learn and apply new concepts to solve complex problems. I am committed to continuous personal and professional growth, always striving for excellence. I look forward to bringing my passion and expertise to a forward-thinking organization.</textarea>
                </div>
            </section>

            <!-- Dynamic Sections -->
            <section>
                <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-4">
                    <h2 class="text-lg font-semibold text-white">7. Work Experience</h2>
                    <button onclick="addExperience()" class="text-sm bg-blue-500/20 text-blue-400 hover:bg-blue-500/30 font-medium px-3 py-1.5 rounded-md transition border border-blue-500/30">+ Add</button>
                </div>
                <div id="experience-container"></div>
            </section>

            <section>
                <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-4">
                    <h2 class="text-lg font-semibold text-white">8. Education</h2>
                    <button onclick="addEducation()" class="text-sm bg-blue-500/20 text-blue-400 hover:bg-blue-500/30 font-medium px-3 py-1.5 rounded-md transition border border-blue-500/30">+ Add</button>
                </div>
                <div id="education-container"></div>
            </section>

            <section>
                <h2 class="text-lg font-semibold text-white border-b border-slate-700 pb-2 mb-4">9. Skills</h2>
                <input type="text" id="skills" class="form-input w-full px-3 py-2" placeholder="JavaScript, React, Node.js" oninput="updateCV()">
            </section>
        </div>

        <!-- Right Side: Live Preview -->
        <div class="relative">
            <div class="text-xs text-blue-400 uppercase tracking-widest mb-2 font-bold hidden lg:block drop-shadow-[0_0_5px_rgba(59,130,246,0.5)]">Live Preview (Auto-saving enabled)</div>
            <div class="relative w-full flex justify-center">
                <div id="cv-preview" class="cv-paper bg-white text-slate-800 rounded-lg border border-slate-700 overflow-hidden mx-auto" style="width: 210mm; min-height: 297mm; transform-origin: top center;"></div>
                <div class="page-break-line no-print"><span>A4 Page Break</span></div>
            </div>
        </div>
    </main>

    <script>
        // --- Global State ---
        let currentTemplate = 1;

        // --- SVG Icons ---
        const icons = {
            email: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>`,
            phone: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>`,
            location: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`,
            linkedin: `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>`,
            website: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>`
        };

        // --- Data Gathering ---
        function getState() {
            return {
                img: document.getElementById('img-preview').src,
                name: document.getElementById('name').value || 'Your Name',
                title: document.getElementById('title').value || 'Your Job Title',
                email: document.getElementById('email').value || 'email@example.com',
                phone: document.getElementById('phone').value || '+1 000 000 000',
                location: document.getElementById('location').value || 'City, Country',
                linkedin: document.getElementById('linkedin').value,
                website: document.getElementById('website').value,
                summary: document.getElementById('summary').value || 'A brief overview of your professional background will appear here.',
                selfDesc: document.getElementById('self-desc').value,
                skills: (document.getElementById('skills').value || 'JavaScript, React, Node.js').split(',').map(s => s.trim()).filter(Boolean),
                experiences: Array.from(document.querySelectorAll('#experience-container .dynamic-section')).map(g => ({
                    title: g.querySelector('.exp-title').value || 'Job Title',
                    company: g.querySelector('.exp-company').value || 'Company Name',
                    period: g.querySelector('.exp-period').value || 'Start - End',
                    desc: g.querySelector('.exp-desc').value || '• Describe your responsibilities here.'
                })),
                educations: Array.from(document.querySelectorAll('#education-container .dynamic-section')).map(g => ({
                    degree: g.querySelector('.edu-degree').value || 'Degree Name',
                    school: g.querySelector('.edu-school').value || 'Institution Name',
                    year: g.querySelector('.edu-year').value || 'Year - Year',
                    score: g.querySelector('.edu-score').value
                }))
            };
        }

        // --- HTML Builders ---
        function buildContact(d, isDark = false) {
            const textColor = isDark ? 'text-slate-300' : 'text-slate-600';
            const iconColor = isDark ? 'text-slate-400' : 'text-primary';
            let html = `<div class="flex flex-wrap gap-x-4 gap-y-2 mt-3 text-xs ${textColor}">`;
            if(d.email) html += `<span class="flex items-center gap-1.5">${icons.email.replace('class="w-4 h-4"', `class="w-3 h-3 ${iconColor}"`)}${d.email}</span>`;
            if(d.phone) html += `<span class="flex items-center gap-1.5">${icons.phone.replace('class="w-4 h-4"', `class="w-3 h-3 ${iconColor}"`)}${d.phone}</span>`;
            if(d.location) html += `<span class="flex items-center gap-1.5">${icons.location.replace('class="w-4 h-4"', `class="w-3 h-3 ${iconColor}"`)}${d.location}</span>`;
            if(d.linkedin) html += `<span class="flex items-center gap-1.5">${icons.linkedin.replace('class="w-4 h-4"', `class="w-3 h-3 ${iconColor}"`)}${d.linkedin}</span>`;
            if(d.website) html += `<span class="flex items-center gap-1.5">${icons.website.replace('class="w-4 h-4"', `class="w-3 h-3 ${iconColor}"`)}${d.website}</span>`;
            html += `</div>`;
            return html;
        }

        function buildSkills(d, isDark = false, isTinted = false) {
            const baseClass = isDark ? 'bg-white/20 text-white' : (isTinted ? 'bg-white text-primary shadow-sm' : 'bg-primary-light text-primary');
            if (!d.skills.length) return '<p class="text-xs text-slate-400">No skills added</p>';
            return d.skills.map(s => `<span class="text-xs ${baseClass} px-2.5 py-1 rounded font-medium">${s}</span>`).join('');
        }

        function buildExpHTML(d, compact = false, isDark = false) {
            const titleClass = isDark ? 'text-white' : 'text-slate-800';
            const subClass = isDark ? 'text-slate-400' : 'text-slate-500';
            const descClass = isDark ? 'text-slate-300' : 'text-slate-600';
            return d.experiences.map(e => `
                <div class="mb-3">
                    <h4 class="${compact ? 'text-xs' : 'text-sm'} font-bold ${titleClass}">${e.title}</h4>
                    <div class="flex justify-between items-baseline mb-1">
                        <p class="text-xs text-primary font-medium">${e.company}</p>
                        <span class="text-[10px] ${subClass} font-medium">${e.period}</span>
                    </div>
                    <p class="text-xs ${descClass} leading-relaxed whitespace-pre-line">${e.desc}</p>
                </div>
            `).join('');
        }

        function buildEduHTML(d, compact = false, isDark = false) {
            const titleClass = isDark ? 'text-white' : 'text-slate-800';
            const subClass = isDark ? 'text-slate-400' : 'text-slate-500';
            return d.educations.map(e => `
                <div class="mb-3">
                    <div class="flex justify-between items-baseline">
                        <h4 class="${compact ? 'text-xs' : 'text-sm'} font-bold ${titleClass}">${e.degree}</h4>
                        <span class="text-[10px] ${subClass} font-medium">${e.year}</span>
                    </div>
                    <div class="flex justify-between items-baseline">
                        <p class="text-xs text-primary font-medium">${e.school}</p>
                        ${e.score ? `<p class="text-[10px] ${isDark ? 'text-slate-300' : 'text-slate-600'} font-semibold ${isDark ? 'bg-white/20' : 'bg-primary-light'} px-1.5 py-0.5 rounded">${e.score}</p>` : ''}
                    </div>
                </div>
            `).join('');
        }

        const declarationHTML = `
            <div class="px-10 py-6 border-t-2 border-slate-100 mt-4">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Declaration</h3>
                <p class="text-sm text-slate-600 leading-relaxed font-medium italic">"I hereby declare that the above details and information are true to the best of my knowledge and belief."</p>
                <div class="mt-6 flex justify-end">
                    <div class="text-center">
                        <div class="border-t border-slate-400 w-48 mt-8 pt-1 text-sm text-slate-700 font-semibold">Signature</div>
                    </div>
                </div>
            </div>`;

        // --- Template Engine ---
        function renderTemplate(id, d) {
            const preview = document.getElementById('cv-preview');
            let html = '';

            // Common wrapper class

        // --- Core Functions ---
        function setTemplate(id) {
            currentTemplate = id;
            document.querySelectorAll('.tmpl-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateCV();
        }

        function updateCV() {
            const data = getState();
            renderTemplate(currentTemplate, data);
            saveData();
        }

        function changeTheme(color, lightColor) {
            document.documentElement.style.setProperty('--primary-color', color);
            document.documentElement.style.setProperty('--primary-light', lightColor);
            localStorage.setItem('cv-theme', JSON.stringify({color, lightColor}));
            updateCV(); 
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('img-preview').src = e.target.result;
                    localStorage.setItem('cv-image', e.target.result);
                    updateCV();
                }
                reader.readAsDataURL(file);
            }
        }

        function addExperience(data = {}) {
            const container = document.getElementById('experience-container');
            const div = document.createElement('div');
            div.className = 'dynamic-section';
            div.innerHTML = `
                <button onclick="this.parentElement.remove(); updateCV()" class="absolute top-3 right-3 text-red-400 hover:text-red-300 text-sm font-bold">? Remove</button>
                <div class="mt-4 space-y-3">
                    <div><label class="block text-xs font-medium text-slate-400 mb-1">Job Title</label><input type="text" class="form-input w-full px-3 py-2 exp-title" placeholder="Software Engineer" value="${data.title || ''}" oninput="updateCV()"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-medium text-slate-400 mb-1">Company</label><input type="text" class="form-input w-full px-3 py-2 exp-company" placeholder="Tech Corp" value="${data.company || ''}" oninput="updateCV()"></div>
                        <div><label class="block text-xs font-medium text-slate-400 mb-1">Period</label><input type="text" class="form-input w-full px-3 py-2 exp-period" placeholder="2020 - Present" value="${data.period || ''}" oninput="updateCV()"></div>
                    </div>
                    <div><label class="block text-xs font-medium text-slate-400 mb-1">Description</label><textarea rows="3" class="form-input w-full px-3 py-2 exp-desc" placeholder="• Led development of..." oninput="updateCV()">${data.desc || ''}</textarea></div>
                </div>`;
            container.appendChild(div);
            updateCV();
        }

                <button onclick="this.parentElement.remove(); updateCV()" class="absolute top-3 right-3 text-red-400 hover:text-red-300 text-sm font-bold">? Remove</button>

        // --- Storage ---
        function saveData() {
            const data = getState();
            data.template = currentTemplate;
            localStorage.setItem('cvcraft-data', JSON.stringify(data));
        }

        function loadData() {
            const savedTheme = JSON.parse(localStorage.getItem('cv-theme'));
            if (savedTheme) changeTheme(savedTheme.color, savedTheme.lightColor);

            const savedImage = localStorage.getItem('cv-image');
            if (savedImage) document.getElementById('img-preview').src = savedImage;

            const savedData = JSON.parse(localStorage.getItem('cvcraft-data'));
            if (!savedData) {
                init(); return;
            }

            if (savedData.template) {
                currentTemplate = savedData.template;
                document.querySelectorAll('.tmpl-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.tmpl-btn')[currentTemplate - 1].classList.add('active');
            }

            document.getElementById('name').value = savedData.name || '';
            document.getElementById('title').value = savedData.title || '';
            document.getElementById('email').value = savedData.email || '';
            document.getElementById('phone').value = savedData.phone || '';
            document.getElementById('linkedin').value = savedData.linkedin || '';
            document.getElementById('website').value = savedData.website || '';
            document.getElementById('location').value = savedData.location || '';
            document.getElementById('summary').value = savedData.summary || '';
            document.getElementById('self-desc').value = savedData.selfDesc || 'I am a highly motivated and hardworking professional dedicated to delivering exceptional results. I thrive in dynamic environments and readily accept new challenges to expand my skill set. My adaptability allows me to quickly learn and apply new concepts to solve complex problems. I am committed to continuous personal and professional growth, always striving for excellence. I look forward to bringing my passion and expertise to a forward-thinking organization.';
            document.getElementById('skills').value = savedData.skills ? savedData.skills.join(', ') : '';

            if (savedData.experiences) savedData.experiences.forEach(exp => addExperience(exp));
            if (savedData.educations) savedData.educations.forEach(edu => addEducation(edu));

            updateCV();
        }

        function clearData() {
            if (confirm("Are you sure you want to reset everything? All data will be deleted.")) {
                localStorage.removeItem('cvcraft-data');
                localStorage.removeItem('cv-image');
                localStorage.removeItem('cv-theme');
                location.reload();
            }
        }

        function init() {
            addExperience({ title: 'Senior Software Engineer', company: 'Tech Corp', period: '2020 - Present', desc: '• Led development of cloud architecture.\n• Improved performance by 40%.' });
            addEducation({ degree: 'B.S. Computer Science', school: 'Harvard University', year: '2016 - 2020', score: '3.8 GPA' });
            updateCV();
        }

        window.onload = loadData;
    </script>
</body>
</html>
